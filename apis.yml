aid: securitypal
name: SecurityPal
description: 'SecurityPal AI is a cybersecurity assurance management platform that pairs AI agents
  with certified human experts to automate security questionnaires, vendor risk assessments (TPRM),
  audit response preparation, Trust Center management, and broader GRC workflows for regulated
  industries including healthcare, financial services, technology, and manufacturing. The platform
  advertises 700+ native integrations (Salesforce, Okta, Jira, Slack, Microsoft Teams, HubSpot,
  Zendesk, Google Workspace, and more) and offers three service tiers (Basecamp self-serve AI, Summit
  AI-plus-concierge, and Everest fully managed). SecurityPal is a Craft Ventures portfolio company. No
  public developer API or documentation is published at this time; this profile captures the company
  identity, public web properties, domain-security posture, and Trust Center.'
